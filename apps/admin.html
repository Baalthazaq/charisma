<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900 text-gray-200">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full p-6 space-y-8">
  <h2 class="text-2xl mb-4 text-teal-400">Admin Console</h2>

  <section class="bg-gray-800/40 p-4 rounded-lg">
    <h3 class="text-xl text-violet-300 mb-2">User Interactions</h3>
    <p class="text-sm mb-4">Monitor recent actions by players.</p>
    <ul class="list-disc pl-6 space-y-1">
      <li>Placeholder interaction 1</li>
      <li>Placeholder interaction 2</li>
    </ul>
  </section>

  <section class="bg-gray-800/40 p-4 rounded-lg">
    <h3 class="text-xl text-violet-300 mb-2">NPC Control</h3>
    <p class="text-sm mb-4">Act as key NPCs to message or influence players.</p>
    <button class="bg-teal-600/60 hover:bg-teal-600 text-white px-3 py-1 rounded">Send NPC Message</button>
  </section>

  <section class="bg-gray-800/40 p-4 rounded-lg">
    <h3 class="text-xl text-violet-300 mb-2">Content Injection</h3>
    <p class="text-sm mb-4">Push new content to in-world apps.</p>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <button class="bg-violet-600/60 hover:bg-violet-600 text-white px-3 py-1 rounded">Add Store Item</button>
      <button class="bg-violet-600/60 hover:bg-violet-600 text-white px-3 py-1 rounded">Add News Item</button>
      <button class="bg-violet-600/60 hover:bg-violet-600 text-white px-3 py-1 rounded">Insert Ads</button>
    </div>
  </section>

  <a href="../index.html" class="text-teal-300 hover:underline">&larr; Back</a>
</body>
</html>
